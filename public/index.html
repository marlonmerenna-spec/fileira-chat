<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Fileira · salas de bate-papo com avatar 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js" type="module"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg: #14142B;
    --bg-soft: #1B1B3A;
    --panel: #1E1E3F;
    --panel-hover: #262650;
    --border: #33305C;
    --text: #F5F3FF;
    --text-muted: #9C97C4;
    --accent: #FF4D8D;
    --accent-soft: rgba(255, 77, 141, 0.18);
    --mint: #4DFFCE;
    --radius: 18px;
    --font-display: 'Fredoka', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(circle at 20% 0%, #23234f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  :focus-visible{ outline: 2px solid var(--mint); outline-offset: 2px; }
  h1,h2,h3{ font-family: var(--font-display); margin:0; }
  .screen{ flex:1; display:none; flex-direction:column; }
  .screen.active{ display:flex; }
  .wrap{ max-width: 720px; margin:0 auto; width:100%; padding: 20px; flex:1; display:flex; flex-direction:column; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px; border-bottom:1px solid var(--border);
    background: var(--bg-soft);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-dot{ width:12px; height:12px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand h1{ font-size: 20px; letter-spacing: 0.3px; }

  /* ---------- Perfil / avatar ---------- */
  .center-stage{ align-items:center; justify-content:center; text-align:center; gap: 18px; }
  .tagline{ color: var(--text-muted); font-size:15px; max-width: 380px; margin: 0 auto; }
  input[type=text]{
    width:100%; max-width: 320px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-family: var(--font-body); font-size:15px;
  }
  input[type=text]::placeholder{ color: var(--text-muted); }
  .btn{
    font-family: var(--font-display); font-weight:600; font-size:15px;
    padding: 13px 22px; border-radius: 14px; border:none; cursor:pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    transition: transform .12s ease, background .12s ease;
  }
  .btn:hover{ background: var(--panel-hover); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color: #1A0512; }
  .btn-primary:hover{ background: #ff6ba0; }
  .btn-ghost{ background: transparent; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .avatar-picker{
    width: 220px; height: 220px; border-radius: 24px; border: 2px dashed var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background: var(--panel); position:relative;
  }
  .avatar-picker model-viewer{ width:100%; height:100%; --poster-color: transparent; }
  .avatar-placeholder{ color: var(--text-muted); font-size: 13px; padding: 12px; }

  .rpm-overlay{ position:fixed; inset:0; background: rgba(10,10,24,0.85); z-index:50; display:none; flex-direction:column; padding: 16px; }
  .rpm-overlay.active{ display:flex; }
  .rpm-close{ align-self:flex-end; margin-bottom:10px; }

  /* ---------- Navegação de abas (Feed / Salas) ---------- */
  .tab-nav{
    display:flex; gap: 6px; padding: 10px 20px 0; background: var(--bg-soft); border-bottom: 1px solid var(--border);
  }
  .tab-btn{
    font-family: var(--font-display); font-weight:600; font-size:14px;
    padding: 10px 16px; border-radius: 12px 12px 0 0; border:none; cursor:pointer;
    background: transparent; color: var(--text-muted);
  }
  .tab-btn.active{ background: var(--bg); color: var(--text); }

  /* ---------- Feed ---------- */
  .composer-card{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display:flex; flex-direction:column; gap:10px; margin-bottom: 18px;
  }
  .composer-card textarea{
    width:100%; resize: vertical; min-height: 56px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
    font-family: var(--font-body); font-size:14px;
  }
  .composer-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .img-preview{ position:relative; max-width: 160px; }
  .img-preview img{ width:100%; border-radius: 12px; display:block; }
  .img-preview button{
    position:absolute; top:-8px; right:-8px; background: var(--accent); color:#1A0512;
    border:none; border-radius: 50%; width:24px; height:24px; cursor:pointer; font-size:12px;
  }
  .post-list{ display:flex; flex-direction:column; gap:14px; padding-bottom: 24px; }
  .post-card{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding: 14px;
  }
  .post-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .post-avatar{ width:38px; height:38px; border-radius:50%; overflow:hidden; background: var(--bg-soft); flex:0 0 auto; }
  .post-avatar model-viewer{ width:100%; height:100%; }
  .post-avatar .fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:13px; font-family: var(--font-display); background: linear-gradient(135deg, #3a3570, #22204a); }
  .post-head .who{ display:flex; flex-direction:column; }
  .post-head .who .n{ font-size:14px; font-weight:600; }
  .post-head .who .t{ font-size:11px; color: var(--text-muted); }
  .post-text{ font-size:14.5px; line-height:1.5; margin: 4px 0 10px; white-space:pre-wrap; word-break:break-word; }
  .post-image{ width:100%; border-radius:14px; margin-bottom:10px; display:block; }
  .post-actions{ display:flex; gap:8px; }
  .like-btn{
    display:flex; align-items:center; gap:6px; background: var(--bg-soft); border:1px solid var(--border);
    color: var(--text-muted); border-radius:100px; padding:7px 14px; font-size:13px; cursor:pointer;
  }
  .like-btn.liked{ color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .empty-feed{ text-align:center; color: var(--text-muted); font-size:13px; padding: 30px 0; }

  /* ---------- Status (tipo MSN) ---------- */
  .status-btn{
    display:flex; align-items:center; gap:6px; background: var(--panel); border:1px solid var(--border);
    color: var(--text); border-radius:100px; padding:6px 12px; font-size:12px; cursor:pointer; position:relative;
  }
  .status-dropdown{
    position:absolute; top: calc(100% + 8px); right:0; background: var(--panel); border:1px solid var(--border);
    border-radius: 14px; padding:6px; display:none; flex-direction:column; min-width: 180px; z-index:40;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .status-dropdown.active{ display:flex; }
  .status-option{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:13px;
    color: var(--text); background:transparent; border:none; text-align:left;
  }
  .status-option:hover{ background: var(--panel-hover); }

  /* badge de humor sobre o avatar */
  .with-badge{ position:relative; }
  .mood-badge{
    position:absolute; bottom:-2px; right:-2px; font-size:13px; background: var(--bg-soft);
    border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--border);
  }

  /* ---------- Mensagens (estilo MSN) ---------- */
  .contact-list{ display:flex; flex-direction:column; gap:8px; }
  .contact-card{
    display:flex; align-items:center; gap:12px; background: var(--panel); border:1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; cursor:pointer;
  }
  .contact-card:hover{ border-color: var(--accent); }
  .contact-avatar{ width:42px; height:42px; border-radius:50%; overflow:hidden; background: var(--bg-soft); flex:0 0 auto; }
  .contact-avatar model-viewer{ width:100%; height:100%; }
  .contact-avatar .fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:14px; font-family: var(--font-display); background: linear-gradient(135deg, #3a3570, #22204a); }
  .contact-info .n{ font-size:14px; font-weight:600; }
  .contact-info .s{ font-size:11px; color: var(--text-muted); }
  .empty-contacts{ text-align:center; color: var(--text-muted); font-size:13px; padding: 30px 0; }

  .chat-view{ display:none; flex-direction:column; flex:1; overflow:hidden; }
  .chat-view.active{ display:flex; }
  .dm-header{ display:flex; align-items:center; gap:10px; padding: 12px 16px; border-bottom:1px solid var(--border); background: var(--bg-soft); }
  .dm-header h3{ font-size:15px; }

  /* ---------- Tela de perfil ---------- */
  .profile-view-card{ display:flex; flex-direction:column; align-items:center; gap:12px; padding: 30px 0; }
  .profile-big-avatar{ width:150px; height:150px; border-radius:50%; overflow:hidden; background: var(--panel); border:2px solid var(--border); position:relative; }
  .profile-big-avatar model-viewer{ width:100%; height:100%; }
  .profile-big-avatar .fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; font-family: var(--font-display); background: linear-gradient(135deg, #3a3570, #22204a); }
  .profile-big-avatar .mood-badge{ width:34px; height:34px; font-size:20px; bottom:4px; right:4px; }
  .profile-status-pill{ font-size:13px; color: var(--text-muted); background: var(--panel); border:1px solid var(--border); border-radius:100px; padding:6px 14px; }

  /* ---------- Criador de avatar 2D ---------- */
  .avatar2d-preview{
    width: 160px; height:160px; border-radius:50%; overflow:hidden; background: var(--panel);
    border: 2px solid var(--border); margin: 0 auto;
  }
  .avatar2d-preview svg{ width:100%; height:100%; display:block; }
  .avatar2d-tabs{ display:flex; gap:6px; overflow-x:auto; padding: 4px 0 10px; }
  .avatar2d-tabs button{
    flex:0 0 auto; font-family: var(--font-body); font-size:12.5px; font-weight:600;
    padding: 8px 14px; border-radius: 100px; border:1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor:pointer; white-space:nowrap;
  }
  .avatar2d-tabs button.active{ background: var(--accent); border-color: var(--accent); color:#1A0512; }
  .swatch-grid{ display:flex; flex-wrap:wrap; gap:10px; padding: 6px 0 16px; }
  .swatch{
    width:44px; height:44px; border-radius:12px; border: 2px solid var(--border); cursor:pointer;
    display:flex; align-items:center; justify-content:center; background: var(--panel); overflow:hidden;
  }
  .swatch.selected{ border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .swatch svg{ width:100%; height:100%; }

  /* ---------- Lobby ---------- */
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin: 22px 0 12px; }
  .section-title h2{ font-size: 18px; }
  .section-title span{ color: var(--text-muted); font-size:13px; }

  .room-list{ display:flex; flex-direction:column; gap:10px; }
  .room-card{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor:pointer; transition: border-color .15s ease, transform .1s ease;
  }
  .room-card:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .room-card .info h3{ font-size:16px; }
  .room-card .info p{ margin: 3px 0 0; color: var(--text-muted); font-size: 13px; }
  .pill{
    font-size:12px; color: var(--mint); border:1px solid rgba(77,255,206,0.35);
    background: rgba(77,255,206,0.08); padding: 4px 10px; border-radius: 100px; white-space:nowrap;
  }

  .private-box{
    background: var(--bg-soft); border:1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display:flex; flex-direction:column; gap:10px; margin-top: 10px;
  }
  .private-box .row{ display:flex; gap:8px; }
  .private-box input{ flex:1; padding: 10px 12px; border-radius: 10px; }

  /* ---------- Sala de chat ---------- */
  .room-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-soft);
  }
  .room-header h2{ font-size:17px; }
  .room-header .sub{ color: var(--text-muted); font-size:12px; }

  /* fileira de avatares — o elemento de assinatura */
  .avatar-row{
    display:flex; gap: 14px; padding: 16px; overflow-x:auto;
    background: linear-gradient(180deg, var(--bg-soft), var(--bg));
    border-bottom: 1px solid var(--border);
  }
  .avatar-slot{
    flex: 0 0 auto; width: 74px; text-align:center;
  }
  .avatar-bust{
    width: 74px; height: 74px; border-radius: 50%; background: var(--panel);
    border: 2px solid var(--border); overflow:hidden; position:relative;
    animation: bob 3.2s ease-in-out infinite;
  }
  .avatar-slot:nth-child(2n) .avatar-bust{ animation-delay: -1.1s; }
  .avatar-slot:nth-child(3n) .avatar-bust{ animation-delay: -2s; }
  @keyframes bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }
  .avatar-bust.talking{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 18px var(--accent);
  }
  .avatar-bust model-viewer{ width:100%; height:100%; }
  .avatar-bust .fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size: 22px; background: linear-gradient(135deg, #3a3570, #22204a);
    color: var(--text);
  }
  .avatar-slot .name{ font-size:11px; color: var(--text-muted); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chat-area{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .messages{ flex:1; overflow-y:auto; padding: 14px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width: 78%; display:flex; flex-direction:column; gap:2px; }
  .msg.mine{ align-self:flex-end; align-items:flex-end; }
  .msg .author{ font-size:11px; color: var(--text-muted); padding: 0 4px; }
  .msg .bubble{
    background: var(--panel); border:1px solid var(--border); border-radius: 16px 16px 16px 4px;
    padding: 9px 13px; font-size: 14.5px; line-height:1.4; word-break: break-word;
  }
  .msg.mine .bubble{ background: var(--accent); color:#1A0512; border-color: var(--accent); border-radius: 16px 16px 4px 16px; }
  .system-msg{ text-align:center; color: var(--text-muted); font-size:12px; margin: 4px 0; }

  .composer{ display:flex; gap:8px; padding: 12px 16px; border-top:1px solid var(--border); background: var(--bg-soft); }
  .composer input{ flex:1; padding: 12px 14px; border-radius: 14px; }
  .typing-indicator{ height: 16px; padding: 0 16px; font-size:12px; color: var(--text-muted); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }

  @media (max-width: 480px){
    .wrap{ padding: 14px; }
    .avatar-picker{ width: 170px; height: 170px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span><h1>Fileira</h1></div>
    <div class="status-btn" id="statusBtn">
      <span id="statusEmoji">🟢</span><span id="statusLabel">Disponível</span>
      <div class="status-dropdown" id="statusDropdown"></div>
    </div>
  </div>

  <!-- TELA 1: Perfil + avatar -->
  <section id="screen-profile" class="screen active">
    <div class="wrap center-stage">
      <h2>Crie seu avatar</h2>
      <p class="tagline">Tire uma foto ou escolha uma selfie. A gente transforma num avatar 3D pra te representar nas salas.</p>

      <div class="avatar-picker" id="avatarPreviewBox">
        <span class="avatar-placeholder">Nenhum avatar ainda</span>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btnOpenRPM">📸 Criar avatar com foto</button>
        <button class="btn" id="btnOpen2D">🎨 Criar avatar do zero</button>
        <button class="btn btn-ghost" id="btnSkipAvatar">Pular por agora</button>
      </div>

      <input type="text" id="nameInput" placeholder="Como quer ser chamado(a)?" maxlength="24" />
      <button class="btn btn-primary" id="btnContinue">Entrar nas salas →</button>
    </div>
  </section>

  <!-- TELA 2: Feed -->
  <section id="screen-feed" class="screen">
    <div class="tab-nav">
      <button class="tab-btn active" id="tabFeed">Feed</button>
      <button class="tab-btn" id="tabLobbyFromFeed">Salas</button>
      <button class="tab-btn" id="tabMessagesFromFeed">Mensagens</button>
    </div>
    <div class="wrap">
      <div class="composer-card">
        <textarea id="postText" placeholder="O que você está pensando?" maxlength="500"></textarea>
        <div id="imgPreviewBox"></div>
        <input type="file" id="postImageInput" accept="image/*" style="display:none" />
        <div class="composer-actions">
          <button class="btn btn-ghost" id="btnAddImage">🖼️ Foto</button>
          <button class="btn btn-primary" id="btnPublish">Publicar</button>
        </div>
      </div>
      <div class="post-list" id="postList"></div>
    </div>
  </section>

  <!-- TELA 3: Lobby -->
  <section id="screen-lobby" class="screen">
    <div class="tab-nav">
      <button class="tab-btn" id="tabFeedFromLobby">Feed</button>
      <button class="tab-btn active" id="tabLobby">Salas</button>
      <button class="tab-btn" id="tabMessagesFromLobby">Mensagens</button>
    </div>
    <div class="wrap">
      <div class="section-title">
        <h2>Salas públicas</h2>
        <span id="onlineHint">conectando…</span>
      </div>
      <div class="room-list" id="publicRoomList"></div>

      <div class="section-title">
        <h2>Salas privadas</h2>
      </div>
      <div class="private-box">
        <div class="row">
          <input type="text" id="privateRoomName" placeholder="Nome da sala nova" />
          <button class="btn" id="btnCreatePrivate">Criar</button>
        </div>
        <div class="row">
          <input type="text" id="joinCodeInput" placeholder="Código de convite" style="text-transform:uppercase" />
          <button class="btn" id="btnJoinCode">Entrar</button>
        </div>
        <div id="privateCreatedMsg" style="font-size:13px; color: var(--mint);"></div>
      </div>
    </div>
  </section>

  <!-- TELA 3: Sala -->
  <section id="screen-room" class="screen">
    <div class="room-header">
      <div>
        <h2 id="roomTitle">Sala</h2>
        <div class="sub" id="roomSub"></div>
      </div>
      <button class="btn btn-ghost" id="btnLeaveRoom">← Sair</button>
    </div>

    <div class="avatar-row" id="avatarRow"></div>

    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typingIndicator"></div>
      <div class="composer">
        <input type="text" id="messageInput" placeholder="Escreva uma mensagem…" maxlength="500" />
        <button class="btn btn-primary" id="btnSend">Enviar</button>
      </div>
    </div>
  </section>

  <!-- TELA: Mensagens (estilo MSN) -->
  <section id="screen-messages" class="screen">
    <div class="tab-nav">
      <button class="tab-btn" id="tabFeedFromMsg">Feed</button>
      <button class="tab-btn" id="tabLobbyFromMsg">Salas</button>
      <button class="tab-btn active" id="tabMessages">Mensagens</button>
    </div>

    <!-- lista de contatos -->
    <div class="wrap" id="contactListView">
      <div class="section-title"><h2>Conversas</h2><span id="onlineCountHint"></span></div>
      <div class="contact-list" id="contactList"></div>
    </div>

    <!-- conversa individual -->
    <div class="chat-view" id="dmChatView">
      <div class="dm-header">
        <button class="btn btn-ghost" id="btnBackToContacts">←</button>
        <div class="contact-avatar" id="dmHeaderAvatar"></div>
        <h3 id="dmHeaderName"></h3>
      </div>
      <div class="messages" id="dmMessages"></div>
      <div class="composer">
        <input type="text" id="dmInput" placeholder="Escreva uma mensagem…" maxlength="1000" />
        <button class="btn btn-primary" id="btnDmSend">Enviar</button>
      </div>
    </div>
  </section>

  <!-- TELA: Perfil de um usuário -->
  <section id="screen-profile-view" class="screen">
    <div class="room-header">
      <div><h2>Perfil</h2></div>
      <button class="btn btn-ghost" id="btnBackFromProfile">← Voltar</button>
    </div>
    <div class="wrap">
      <div class="profile-view-card">
        <div class="profile-big-avatar" id="profileBigAvatar"></div>
        <h2 id="profileName"></h2>
        <span class="profile-status-pill" id="profileStatusPill"></span>
      </div>
    </div>
  </section>

  <!-- TELA: Criador de avatar 2D (monte-o-boneco) -->
  <section id="screen-avatar2d" class="screen">
    <div class="room-header">
      <div><h2>Monte seu avatar</h2></div>
      <button class="btn btn-ghost" id="btnBackFrom2D">← Voltar</button>
    </div>
    <div class="wrap">
      <div class="avatar2d-preview" id="avatar2dPreview"></div>

<script>
const socket = io();

// -------- Estado local --------
let myProfile = { name: '', avatarUrl: null, avatarType: null, avatarConfig: null, status: 'disponivel' };
let currentRoom = null;
let usersInRoom = {};
let typingTimeout = null;

// -------- Elementos --------
const screens = {
  profile: document.getElementById('screen-profile'),
  feed: document.getElementById('screen-feed'),
  lobby: document.getElementById('screen-lobby'),
  room: document.getElementById('screen-room'),
  messages: document.getElementById('screen-messages'),
  profileView: document.getElementById('screen-profile-view'),
  avatar2d: document.getElementById('screen-avatar2d'),
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// -------- Avatar (Avaturn) --------
// O Ready Player Me encerrou o serviço público em 2026 (foi comprado pela Netflix).
// Trocamos pro Avaturn, que oferece o mesmo tipo de fluxo: selfie -> avatar 3D.
const rpmOverlay = document.getElementById('rpmOverlay');
const avaturnContainer = document.getElementById('avaturnContainer');
let avaturnSdk = null;
let avaturnLoading = false;

document.getElementById('btnOpenRPM').addEventListener('click', async () => {
  rpmOverlay.classList.add('active');
  if (avaturnSdk || avaturnLoading) return; // já carregado ou carregando
  avaturnLoading = true;
  try {
    const { AvaturnSDK } = await import('https://cdn.jsdelivr.net/npm/@avaturn/sdk/dist/index.js');
    avaturnSdk = new AvaturnSDK();
    await avaturnSdk.init(avaturnContainer, { url: 'https://demo.avaturn.dev' });
    avaturnSdk.on('export', (data) => {
      myProfile.avatarUrl = data.url;
      myProfile.avatarType = '3d';
      myProfile.avatarConfig = null;
      renderAvatarPreview();
      rpmOverlay.classList.remove('active');
    });
  } catch (err) {
    console.error('Erro ao carregar o criador de avatar:', err);
    avaturnContainer.innerHTML = '<p style="padding:20px;color:#333;">Não foi possível carregar o criador de avatar agora. Tenta de novo em instantes.</p>';
  } finally {
    avaturnLoading = false;
  }
});
document.getElementById('btnCloseRPM').addEventListener('click', () => {
  rpmOverlay.classList.remove('active');
});
document.getElementById('btnSkipAvatar').addEventListener('click', () => {
  myProfile.avatarUrl = null;
  myProfile.avatarType = null;
  myProfile.avatarConfig = null;
  renderAvatarPreview();
});
function renderAvatarPreview(){
  const box = document.getElementById('avatarPreviewBox');
  if (myProfile.avatarType){
    box.innerHTML = avatarMediaHtml(myProfile);
  } else {
    box.innerHTML = `<span class="avatar-placeholder">Sem avatar — vamos usar suas iniciais</span>`;
  }
}

// ==================== AVATAR 2D (monte-o-boneco) ====================
const AVATAR2D_PARTS = {
  skin: {
    label: 'Pele',
    options: [
      { id: 'p1', color: '#FFE0BD' }, { id: 'p2', color: '#FCE0C0' }, { id: 'p6', color: '#F0C199' },
      { id: 'p3', color: '#C98A5C' }, { id: 'p4', color: '#8D5A3B' },
      { id: 'p5', color: '#5A3825' }, { id: 'p7', color: '#2E1912' },
    ],
  },
  hair: {
    label: 'Cabelo',
    options: [
      { id: 'none',     label: 'Careca' },
      { id: 'buzz',     label: 'Raspado' },
      { id: 'short',    label: 'Curto' },
      { id: 'bangs',    label: 'Franjinha' },
      { id: 'bob',      label: 'Chanel' },
      { id: 'long',     label: 'Longo' },
      { id: 'ponytail', label: 'Rabo de cavalo' },
      { id: 'curly',    label: 'Cacheado' },
      { id: 'afro',     label: 'Afro' },
      { id: 'mohawk',   label: 'Moicano' },
    ],
  },
  hairColor: {
    label: 'Cor do cabelo',
    options: [
      { id: 'h1', color: '#2B2118' }, { id: 'h2', color: '#7A4B25' },
      { id: 'h3', color: '#D4A017' }, { id: 'h4', color: '#B33B3B' },
      { id: 'h5', color: '#E8E8F0' }, { id: 'h6', color: '#FF4D8D' },
      { id: 'h7', color: '#3B5BA5' }, { id: 'h8', color: '#4CAF6D' },
      { id: 'h9', color: '#8B5CF6' }, { id: 'h10', color: '#FFFFFF' },
    ],
  },
  outfit: {
    label: 'Roupa',
    options: [
      { id: 'round',      label: 'Gola redonda' },
      { id: 'vneck',      label: 'Gola V' },
      { id: 'tank',       label: 'Regata' },
      { id: 'turtleneck', label: 'Gola alta' },
      { id: 'hoodie',     label: 'Moletom' },
      { id: 'jacket',     label: 'Jaqueta' },
    ],
  },
  outfitColor: {
    label: 'Cor da roupa',
    options: [
      { id: 'o1', color: '#FF4D8D' }, { id: 'o2', color: '#4DFFCE' },
      { id: 'o3', color: '#5B8DEF' }, { id: 'o4', color: '#F5F3FF' },
      { id: 'o5', color: '#33305C' }, { id: 'o6', color: '#F5A623' },
      { id: 'o7', color: '#9B59B6' }, { id: 'o8', color: '#1B998B' },
      { id: 'o9', color: '#1A1A1A' }, { id: 'o10', color: '#6B4226' },
    ],
  },
  accessory: {
    label: 'Acessório',
    options: [
      { id: 'none',       label: 'Nenhum' },
      { id: 'glasses',    label: 'Óculos' },
      { id: 'sunglasses', label: 'Óculos escuro' },
      { id: 'hat',        label: 'Boné' },
      { id: 'beanie',     label: 'Gorro' },
      { id: 'headphones', label: 'Fone' },
      { id: 'earrings',   label: 'Brincos' },
      { id: 'bowtie',     label: 'Gravata borboleta' },
      { id: 'necklace',   label: 'Colar' },
    ],
  },
};
const DEFAULT_AVATAR2D_CONFIG = {
  skin: 'p1', hair: 'short', hairColor: 'h1', outfit: 'round', outfitColor: 'o1', accessory: 'none',
};

function hairSvg(style, color){
  const shortCap = `<path d="M18 40 Q20 8 50 8 Q80 8 82 40 Q70 20 50 20 Q30 20 18 40 Z" fill="${color}"/>`;
  switch(style){
    case 'buzz': return `<path d="M20 36 Q22 14 50 14 Q78 14 80 36 Q68 24 50 24 Q32 24 20 36 Z" fill="${color}" opacity="0.85"/>`;
    case 'short': return shortCap;
    case 'bangs': return `${shortCap}<path d="M24 34 Q50 44 76 34 L76 25 Q50 33 24 25 Z" fill="${color}"/>`;
    case 'bob': return `${shortCap}<path d="M18 38 L18 58 L28 58 L28 40 Z" fill="${color}"/><path d="M82 38 L82 58 L72 58 L72 40 Z" fill="${color}"/>`;
    case 'long': return `${shortCap}
      <path d="M16 38 Q14 70 20 88 L30 88 Q24 60 26 38 Z" fill="${color}"/>
      <path d="M84 38 Q86 70 80 88 L70 88 Q76 60 74 38 Z" fill="${color}"/>`;
    case 'ponytail': return `${shortCap}<path d="M78 20 Q92 30 86 55 Q80 58 78 50 Q84 34 74 22 Z" fill="${color}"/>`;
    case 'curly': return `<circle cx="26" cy="26" r="9" fill="${color}"/><circle cx="40" cy="16" r="10" fill="${color}"/>
      <circle cx="58" cy="14" r="10" fill="${color}"/><circle cx="74" cy="24" r="9" fill="${color}"/>
      <circle cx="50" cy="22" r="11" fill="${color}"/>`;
    case 'afro': return `<circle cx="20" cy="34" r="10" fill="${color}"/><circle cx="30" cy="15" r="12" fill="${color}"/>
      <circle cx="50" cy="9" r="13" fill="${color}"/><circle cx="70" cy="15" r="12" fill="${color}"/>
      <circle cx="80" cy="34" r="10" fill="${color}"/><circle cx="50" cy="19" r="14" fill="${color}"/>
      <circle cx="16" cy="42" r="7" fill="${color}"/><circle cx="84" cy="42" r="7" fill="${color}"/>`;
    case 'mohawk': return `<path d="M42 6 L58 6 L54 34 L46 34 Z" fill="${color}"/>`;
    default: return '';
  }
}
function eyesSvg(status){
  switch(status){
    case 'animado': return `<path d="M33 46 Q38 39 43 46" stroke="#2B2118" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M57 46 Q62 39 67 46" stroke="#2B2118" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    case 'ausente': return `<path d="M33 46 L43 46" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>
      <path d="M57 46 L67 46" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>`;
    case 'desanimado': return `<ellipse cx="38" cy="47" rx="3" ry="3.4" fill="#2B2118"/><ellipse cx="62" cy="47" rx="3" ry="3.4" fill="#2B2118"/>
      <path d="M32 42 Q38 40 44 42" stroke="#2B2118" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M56 42 Q62 40 68 42" stroke="#2B2118" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    case 'triste': return `<ellipse cx="38" cy="48" rx="3" ry="3.4" fill="#2B2118"/><ellipse cx="62" cy="48" rx="3" ry="3.4" fill="#2B2118"/>`;
    default: return `<ellipse cx="38" cy="46" rx="3" ry="3.6" fill="#2B2118"/><ellipse cx="62" cy="46" rx="3" ry="3.6" fill="#2B2118"/>`;
  }
}
function mouthSvg(status){
  switch(status){
    case 'animado': return `<path d="M36 60 Q50 76 64 60 Q50 68 36 60 Z" fill="#8B2E4A"/>`;
    case 'ocupado': case 'trabalhando': return `<path d="M38 62 L62 62" stroke="#8B2E4A" stroke-width="3" stroke-linecap="round"/>`;
    case 'ausente': return `<ellipse cx="50" cy="62" rx="4" ry="3" fill="#8B2E4A"/>`;
    case 'desanimado': return `<path d="M38 65 Q50 58 62 65" stroke="#8B2E4A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    case 'triste': return `<path d="M37 67 Q50 57 63 67" stroke="#8B2E4A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    default: return `<path d="M38 60 Q50 68 62 60" stroke="#8B2E4A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
}
function extrasSvg(status){
  // detalhe extra por status — o "chorando de verdade" que foi pedido lá atrás
  if (status === 'triste') {
    return `<path d="M33 50 Q30 58 33 64 Q37 60 35 50 Z" fill="#5B8DEF" opacity="0.85"/>`;
  }
  if (status === 'ausente') {
    return `<text x="72" y="20" font-size="12" fill="#9C97C4" font-family="sans-serif">z z</text>`;
  }
  return '';
}
function outfitSvg(style, color){
  switch(style){
    case 'vneck': return `<path d="M10 100 L10 82 Q50 70 90 82 L90 100 Z" fill="${color}"/><path d="M40 82 L50 92 L60 82 L54 78 L50 84 L46 78 Z" fill="#00000022"/>`;
    case 'tank': return `<path d="M14 100 L14 84 Q50 76 86 84 L86 100 Z" fill="${color}"/><rect x="30" y="78" width="6" height="10" fill="${color}"/><rect x="64" y="78" width="6" height="10" fill="${color}"/>`;
    case 'turtleneck': return `<path d="M8 100 L8 80 Q50 68 92 80 L92 100 Z" fill="${color}"/><rect x="38" y="67" width="24" height="15" rx="7" fill="${color}"/>`;
    case 'hoodie': return `<path d="M6 100 L6 80 Q50 64 94 80 L94 100 Z" fill="${color}"/><path d="M32 80 Q50 92 68 80 L68 88 Q50 100 32 88 Z" fill="#00000022"/>`;
    case 'jacket': return `<path d="M8 100 L8 82 Q50 70 92 82 L92 100 Z" fill="${color}"/><path d="M50 78 L46 100 M50 78 L54 100" stroke="#00000033" stroke-width="2"/><path d="M36 80 L44 90 L50 82 L56 90 L64 80" fill="none" stroke="#00000022" stroke-width="2"/>`;
    default: return `<path d="M10 100 L10 82 Q50 72 90 82 L90 100 Z" fill="${color}"/>`;
  }
}
function accessorySvg(kind){
  switch(kind){
    case 'glasses': return `<circle cx="38" cy="46" r="9" fill="none" stroke="#2B2118" stroke-width="2.5"/>
      <circle cx="62" cy="46" r="9" fill="none" stroke="#2B2118" stroke-width="2.5"/>
      <path d="M47 46 L53 46" stroke="#2B2118" stroke-width="2.5"/>`;
    case 'sunglasses': return `<ellipse cx="38" cy="46" rx="10" ry="8" fill="#1A1A1A" opacity="0.9"/>
      <ellipse cx="62" cy="46" rx="10" ry="8" fill="#1A1A1A" opacity="0.9"/>
      <path d="M48 45 L52 45" stroke="#1A1A1A" stroke-width="3"/>`;
    case 'hat': return `<path d="M16 32 Q20 6 50 6 Q80 6 84 32 Q66 22 50 22 Q34 22 16 32 Z" fill="#33305C"/>
      <ellipse cx="50" cy="32" rx="34" ry="6" fill="#26234a"/>`;
    case 'beanie': return `<path d="M18 34 Q20 8 50 8 Q80 8 82 34 Q82 30 50 30 Q18 30 18 34 Z" fill="#33305C"/>
      <rect x="16" y="28" width="68" height="8" rx="4" fill="#26234a"/><circle cx="50" cy="8" r="4" fill="#F5A623"/>`;
    case 'headphones': return `<path d="M22 40 Q22 10 50 10 Q78 10 78 40" fill="none" stroke="#2B2118" stroke-width="4"/>
      <rect x="14" y="38" width="10" height="16" rx="4" fill="#2B2118"/><rect x="76" y="38" width="10" height="16" rx="4" fill="#2B2118"/>`;
    case 'earrings': return `<circle cx="18" cy="52" r="2.6" fill="#F5A623"/><circle cx="82" cy="52" r="2.6" fill="#F5A623"/>`;
    case 'bowtie': return `<path d="M36 78 L48 82 L36 86 Z" fill="#8B2E4A"/><path d="M64 78 L52 82 L64 86 Z" fill="#8B2E4A"/><circle cx="50" cy="82" r="3" fill="#5A1B30"/>`;
    case 'necklace': return `<path d="M36 78 Q50 92 64 78" fill="none" stroke="#F5A623" stroke-width="2"/><circle cx="50" cy="90" r="3" fill="#F5A623"/>`;
    default: return '';
  }
}
function skinColor(id){
  const opt = AVATAR2D_PARTS.skin.options.find(o => o.id === id);
  return opt ? opt.color : AVATAR2D_PARTS.skin.options[0].color;
}
function colorById(category, id){
  const opt = AVATAR2D_PARTS[category].options.find(o => o.id === id);
  return opt ? opt.color : AVATAR2D_PARTS[category].options[0].color;
}

function buildAvatarSVG(config, status){
  const cfg = { ...DEFAULT_AVATAR2D_CONFIG, ...(config || {}) };
  const skin = skinColor(cfg.skin);
  const hColor = colorById('hairColor', cfg.hairColor);
  const oColor = colorById('outfitColor', cfg.outfitColor);
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#00000000"/>
    ${outfitSvg(cfg.outfit, oColor)}
    <circle cx="50" cy="44" r="30" fill="${skin}"/>
    ${eyesSvg(status)}
    ${mouthSvg(status)}
    ${extrasSvg(status)}
    ${hairSvg(cfg.hair, hColor)}
    ${accessorySvg(cfg.accessory)}
  </svg>`;
}

// Renderização unificada de avatar (3D via Avaturn OU 2D monte-o-boneco OU iniciais)
function avatarMediaHtml(u){
  if (u.avatarType === '2d' && u.avatarConfig){
    return buildAvatarSVG(u.avatarConfig, u.status);
  }
  if (u.avatarType === '3d' && u.avatarUrl){
    return `<model-viewer src="${u.avatarUrl}" camera-controls disable-zoom auto-rotate shadow-intensity="0"></model-viewer>`;
  }
  return `<div class="fallback">${initials(u.name)}</div>`;
}

// -------- Customizador do avatar 2D --------
let avatar2dConfig = { ...DEFAULT_AVATAR2D_CONFIG };
let avatar2dActiveTab = 'skin';

document.getElementById('btnOpen2D').addEventListener('click', () => {
  avatar2dConfig = { ...DEFAULT_AVATAR2D_CONFIG };
  avatar2dActiveTab = 'skin';
  renderAvatar2DScreen();
  showScreen('avatar2d');
});
document.getElementById('btnBackFrom2D').addEventListener('click', () => showScreen('profile'));
document.getElementById('btnConfirm2D').addEventListener('click', () => {
  myProfile.avatarType = '2d';
  myProfile.avatarConfig = { ...avatar2dConfig };
  myProfile.avatarUrl = null;
  renderAvatarPreview();
  showScreen('profile');
});

function renderAvatar2DScreen(){
  document.getElementById('avatar2dPreview').innerHTML = buildAvatarSVG(avatar2dConfig, myProfile.status);
  const tabsEl = document.getElementById('avatar2dTabs');
  tabsEl.innerHTML = Object.entries(AVATAR2D_PARTS).map(([key, cat]) => `
    <button class="${key === avatar2dActiveTab ? 'active' : ''}" data-tab="${key}">${cat.label}</button>
  `).join('');
  tabsEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      avatar2dActiveTab = btn.dataset.tab;
      renderAvatar2DScreen();
    });
  });
  renderAvatar2DSwatches();
}
function renderAvatar2DSwatches(){
  const cat = AVATAR2D_PARTS[avatar2dActiveTab];
  const grid = document.getElementById('avatar2dSwatches');
  grid.innerHTML = cat.options.map(opt => {
    const selected = avatar2dConfig[avatar2dActiveTab] === opt.id ? 'selected' : '';
    const inner = opt.color
      ? `<div style="width:100%;height:100%;background:${opt.color};"></div>`
      : `<span style="font-size:10px; text-align:center; color:var(--text); padding:2px;">${opt.label}</span>`;
    return `<div class="swatch ${selected}" data-id="${opt.id}" title="${opt.label || ''}">${inner}</div>`;
  }).join('');
  grid.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      avatar2dConfig[avatar2dActiveTab] = sw.dataset.id;
      renderAvatar2DScreen();
    });
  });
}

// -------- Perfil --------
document.getElementById('btnContinue').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim() || 'Visitante';
  myProfile.name = name;
  socket.emit('set_profile', myProfile);
  socket.emit('get_rooms');
  socket.emit('get_posts');
  socket.emit('get_online_users');
  showScreen('feed');
});

document.getElementById('tabLobbyFromFeed').addEventListener('click', () => showScreen('lobby'));
document.getElementById('tabFeedFromLobby').addEventListener('click', () => showScreen('feed'));
document.getElementById('tabMessagesFromFeed').addEventListener('click', () => showScreen('messages'));
document.getElementById('tabMessagesFromLobby').addEventListener('click', () => showScreen('messages'));
document.getElementById('tabFeedFromMsg').addEventListener('click', () => showScreen('feed'));
document.getElementById('tabLobbyFromMsg').addEventListener('click', () => showScreen('lobby'));
document.getElementById('btnBackFromProfile').addEventListener('click', () => showScreen(profileViewReturnScreen || 'feed'));

// -------- Status (tipo MSN) --------
const STATUSES = {
  disponivel:  { label: 'Disponível',  emoji: '🟢' },
  ocupado:     { label: 'Ocupado',     emoji: '🔴' },
  trabalhando: { label: 'Trabalhando', emoji: '💼' },
  ausente:     { label: 'Ausente',     emoji: '🌙' },
  animado:     { label: 'Animado',     emoji: '😄' },
  desanimado:  { label: 'Desanimado',  emoji: '😔' },
  triste:      { label: 'Triste',      emoji: '😢' },
};
function moodEmoji(status){ return (STATUSES[status] || STATUSES.disponivel).emoji; }
function moodLabel(status){ return (STATUSES[status] || STATUSES.disponivel).label; }
function badgeHtml(status){
  return status ? `<span class="mood-badge">${moodEmoji(status)}</span>` : '';
}

const statusDropdown = document.getElementById('statusDropdown');
statusDropdown.innerHTML = Object.entries(STATUSES).map(([key, s]) => `
  <button class="status-option" data-status="${key}">${s.emoji} ${s.label}</button>
`).join('');
document.getElementById('statusBtn').addEventListener('click', (e) => {
  if (e.target.closest('.status-option')) return;
  statusDropdown.classList.toggle('active');
});
statusDropdown.querySelectorAll('.status-option').forEach(opt => {
  opt.addEventListener('click', () => {
    const status = opt.dataset.status;
    myProfile.status = status;
    document.getElementById('statusEmoji').textContent = moodEmoji(status);
    document.getElementById('statusLabel').textContent = moodLabel(status);

    statusDropdown.classList.remove('active');

});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#statusBtn')) statusDropdown.classList.remove('active');
});

let onlineUsersMap = {};
socket.on('online_users', (list) => {
  onlineUsersMap = {};

  renderContactList();
  if (currentRoom) renderAvatarRow(); // atualiza os "rostinhos" na sala se o humor de alguém mudou

let profileViewReturnScreen = 'feed';
function openProfile(id, fallbackName, fallbackAvatar) {
  profileViewReturnScreen = Object.keys(screens).find(k => screens[k].classList.contains('active')) || 'feed';

socket.on('private_room_created', ({ roomId, code, name }) => {

  joinRoom('p_' + code);
});

function joinRoom(roomId){
  socket.emit('join_room', { roomId });
}

// -------- Sala --------
socket.on('join_error', (msg) => alert(msg));

socket.on('room_joined', ({ room, users, history }) => {
  currentRoom = room;
  usersInRoom = {};
  users.forEach(u => usersInRoom[u.id] = u);
  document.getElementById('roomTitle').textContent = room.name;
  document.getElementById('roomSub').textContent = room.isPrivate ? 'Sala privada' : (room.topic || '');
  document.getElementById('messages').innerHTML = '';
  history.forEach(renderMessage);
  renderAvatarRow();
  showScreen('room');
  scrollToBottom();
});

socket.on('user_list', (users) => {
  usersInRoom = {};
  users.forEach(u => usersInRoom[u.id] = u);
  renderAvatarRow();
});

socket.on('user_joined', (u) => {
  addSystemMessage(`${u.name} entrou na sala`);
});
socket.on('user_left', ({ id }) => {
  const u = usersInRoom[id];
  if (u) addSystemMessage(`${u.name} saiu da sala`);
});

socket.on('chat_message', (msg) => {
  renderMessage(msg);
  scrollToBottom();
  pulseAvatar(msg.userId);
});

socket.on('user_typing', ({ id, isTyping }) => {
  const u = usersInRoom[id];
  const el = document.getElementById('typingIndicator');
  el.textContent = (isTyping && u) ? `${u.name} está digitando…` : '';
});

document.getElementById('btnLeaveRoom').addEventListener('click', () => {
  socket.emit('leave_room');
  socket.emit('get_rooms');
  showScreen('lobby');
});

const messageInput = document.getElementById('messageInput');
document.getElementById('btnSend').addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
  socket.emit('typing', true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => socket.emit('typing', false), 1200);
});
function sendMessage(){
  const text = messageInput.value.trim();
  if (!text) return;
  socket.emit('send_message', { text });
  messageInput.value = '';
}

function renderAvatarRow(){
  const row = document.getElementById('avatarRow');
  row.innerHTML = Object.values(usersInRoom).map(u => {
    const live = onlineUsersMap[u.id] || u;
    const status = live.status || null;
    return `
    <div class="avatar-slot" data-user="${u.id}">
      <div class="avatar-bust with-badge" id="bust-${u.id}">
        ${avatarMediaHtml(live)}
        ${badgeHtml(status)}
      </div>
      <div class="name">${escapeHtml(u.name)}</div>
    </div>
  `;
  }).join('');
  row.querySelectorAll('.avatar-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      const u = usersInRoom[slot.dataset.user];
      if (u) openProfile(slot.dataset.user, u.name, u.avatarUrl);
    });
  });
}
function pulseAvatar(userId){
  const bust = document.getElementById('bust-' + userId);
  if (!bust) return;
  bust.classList.add('talking');
  setTimeout(() => bust.classList.remove('talking'), 900);
}

function renderMessage(msg){
  const mine = msg.userId === socket.id;
  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' mine' : '');
  el.innerHTML = `
    <div class="author">${mine ? '' : escapeHtml(msg.name)}</div>
    <div class="bubble">${escapeHtml(msg.text)}</div>
  `;
  document.getElementById('messages').appendChild(el);
}
function addSystemMessage(text){
  const el = document.createElement('div');
  el.className = 'system-msg';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  scrollToBottom();
}
function scrollToBottom(){
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}
function initials(name){
  return (name || '?').split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// ==================== FEED ====================
let pendingImage = null; // dataURL já redimensionada, pronta pra publicar
let allPosts = []; // cache local, mais recentes primeiro

function resizeImage(file, maxWidth = 720, quality = 0.72){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('btnAddImage').addEventListener('click', () => {
  document.getElementById('postImageInput').click();
});
document.getElementById('postImageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingImage = await resizeImage(file);
    document.getElementById('imgPreviewBox').innerHTML = `
      <div class="img-preview">
        <img src="${pendingImage}" />
        <button id="btnRemoveImg" title="Remover">✕</button>
      </div>`;
    document.getElementById('btnRemoveImg').addEventListener('click', () => {
      pendingImage = null;
      document.getElementById('imgPreviewBox').innerHTML = '';
      e.target.value = '';
    });
  } catch (err) {
    console.error(err);
    alert('Não consegui processar essa imagem, tenta outra.');
  }
});

document.getElementById('btnPublish').addEventListener('click', () => {
  const textEl = document.getElementById('postText');
  const text = textEl.value.trim();
  if (!text && !pendingImage) return;
  socket.emit('create_post', { text, image: pendingImage });
  textEl.value = '';
  pendingImage = null;
  document.getElementById('imgPreviewBox').innerHTML = '';
  document.getElementById('postImageInput').value = '';
});

socket.on('post_list', (list) => {
  allPosts = list;
  renderPosts();
});
socket.on('new_post', (post) => {
  allPosts.unshift(post);
  renderPosts();
});
socket.on('post_liked', ({ postId, likeCount, likedBy }) => {
  const p = allPosts.find(p => p.id === postId);
  if (p) { p.likeCount = likeCount; p.likedBy = likedBy; }
  const btn = document.querySelector(`.like-btn[data-post="${postId}"]`);
  if (btn) {
    const mine = likedBy.includes(socket.id);
    btn.classList.toggle('liked', mine);
    btn.querySelector('.count').textContent = likeCount;
  }
});

function renderPosts(){
  const el = document.getElementById('postList');
  if (allPosts.length === 0){
    el.innerHTML = '<div class="empty-feed">Ainda não tem nenhum post. Seja o primeiro a publicar! 🎉</div>';
    return;
  }
  el.innerHTML = allPosts.map(postCardHtml).join('');
  el.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      socket.emit('like_post', { postId: btn.dataset.post });
    });
  });
  el.querySelectorAll('.post-avatar').forEach(av => {
    av.addEventListener('click', () => {
      openProfile(av.dataset.uid, av.dataset.name, av.dataset.avatar || null);
    });
  });
}

function postCardHtml(p){
  const mine = p.likedBy && p.likedBy.includes(socket.id);
  const time = new Date(p.ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  const live = onlineUsersMap[p.authorId];
  const status = live ? live.status : null;
  const avatarSrc = live || p; // prefere dados atuais de quem postou; se offline, usa o snapshot salvo no post
  return `
    <div class="post-card">
      <div class="post-head">
        <div class="post-avatar with-badge" data-uid="${p.authorId}" data-name="${escapeHtml(p.name)}" data-avatar="${p.avatarUrl || ''}">
          ${avatarMediaHtml({ ...avatarSrc, name: p.name })}
          ${badgeHtml(status)}
        </div>
        <div class="who">
          <span class="n">${escapeHtml(p.name)}</span>
          <span class="t">${time}</span>
        </div>
      </div>
      ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ''}
      ${p.image ? `<img class="post-image" src="${p.image}" />` : ''}
      <div class="post-actions">
        <button class="like-btn ${mine ? 'liked' : ''}" data-post="${p.id}">
          ${mine ? '💖' : '🤍'} <span class="count">${p.likeCount}</span> curtir${p.likeCount === 1 ? '' : 'es'}
        </button>
      </div>
    </div>
  `;
}

// ==================== MENSAGENS (estilo MSN) ====================
let currentDmWith = null;
let unreadCounts = {}; // id -> quantidade de mensagens novas

function renderContactList(){
  const el = document.getElementById('contactList');
  const others = Object.values(onlineUsersMap).filter(u => u.id !== socket.id);
  document.getElementById('onlineCountHint').textContent = `${others.length} online`;
  if (others.length === 0){
    el.innerHTML = '<div class="empty-contacts">Ninguém mais online agora. Chama alguém pra testar junto! 👋</div>';
    return;
  }
  el.innerHTML = others.map(u => `
    <div class="contact-card" data-id="${u.id}">
      <div class="contact-avatar with-badge">
        ${avatarMediaHtml(u)}
        ${badgeHtml(u.status)}
      </div>
      <div class="contact-info">
        <div class="n">${escapeHtml(u.name)}</div>
        <div class="s">${moodLabel(u.status)}</div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.contact-card').forEach(card => {
    card.addEventListener('click', () => openDm(card.dataset.id));
  });
}

function openDm(userId){
  currentDmWith = userId;
  const u = onlineUsersMap[userId];
  document.getElementById('dmHeaderName').textContent = u ? u.name : 'Visitante';
  document.getElementById('dmHeaderAvatar').innerHTML = u ? avatarMediaHtml(u) : `<div class="fallback">?</div>`;
  document.getElementById('dmMessages').innerHTML = '';
  document.getElementById('contactListView').style.display = 'none';
  document.getElementById('dmChatView').classList.add('active');
  socket.emit('get_dm_history', { withId: userId });
}
document.getElementById('btnBackToContacts').addEventListener('click', () => {
  currentDmWith = null;
  document.getElementById('dmChatView').classList.remove('active');
  document.getElementById('contactListView').style.display = '';
});

socket.on('dm_history', ({ withId, messages }) => {
  if (withId !== currentDmWith) return;
  const box = document.getElementById('dmMessages');
  box.innerHTML = '';
  messages.forEach(renderDmMessage);
  box.scrollTop = box.scrollHeight;
});
socket.on('dm_message', ({ withId, message }) => {
  if (withId === currentDmWith) {
    renderDmMessage(message);
    const box = document.getElementById('dmMessages');
    box.scrollTop = box.scrollHeight;
  }
});
function renderDmMessage(msg){
  const mine = msg.fromId === socket.id;
  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' mine' : '');
  el.innerHTML = `<div class="bubble">${escapeHtml(msg.text)}</div>`;
  document.getElementById('dmMessages').appendChild(el);
}
function sendDm(){
  const input = document.getElementById('dmInput');
  const text = input.value.trim();
  if (!text || !currentDmWith) return;
  socket.emit('dm_send', { toId: currentDmWith, text });
  input.value = '';
}
document.getElementById('btnDmSend').addEventListener('click', sendDm);
document.getElementById('dmInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendDm();
});
</script>
